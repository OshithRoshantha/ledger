[project]
name = "ledger-api"
version = "1.0.0"
description = "Ledger – single-user personal money manager API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "uvicorn-worker>=0.2",
  "motor>=3.5,<4",
  "beanie>=1.26,<2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "PyJWT>=2.9",
  "slowapi>=0.1.9",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "mongomock-motor>=0.0.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["core/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
