# Render Blueprint for the Ledger API (Render dashboard -> New -> Blueprint -> pick this repo).
# The frontend is hosted on GitHub Pages; MongoDB is Atlas.
services:
  - type: web
    name: ledger-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # closest Render region to Sri Lanka
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGO_DB
        value: ledger
      - key: DEFAULT_TIMEZONE
        value: Asia/Colombo
      - key: DEFAULT_SALARY_DAY
        value: "5"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      # --- you are prompted for these when the Blueprint is created ---
      - key: MONGO_URL              # Atlas connection string with the app user's password
        sync: false
      - key: TOTP_ENC_KEY           # copy from ledger/.env (must match the key used by create-user)
        sync: false
      - key: FRONTEND_ORIGIN        # e.g. https://money.example.com (the GitHub Pages custom domain)
        sync: false
